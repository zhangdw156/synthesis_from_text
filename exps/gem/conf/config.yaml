# GEM 实验配置
# Use gem Hydra preset (no timestamped output dir): register_hydra_preset() in script, then:

defaults:
  - hydra: gem_preset
  - gem_config
  - _self_

# 数据配置
data:
  input_path: "data/ultrafineweb-en-part-0036-of-2048.parquet"
  content_column: "content"   # 文本列名
  data_id_column: null      # 原始数据标号列名，null 则用行号作为 data_id
  max_rows: null            # 最多加载行数，null 表示不限制（用于测试可设小值）

# 输出配置：只保存最终成功轨迹，不保存失败与中间结果
output:
  output_dir: "outputs"
  target_success_count: 1000  # 目标成功条数，达到后结束；null 或 <0 表示处理完 parquet 全部数据再结束
  save_every_n_success: 50   # 每累计多少条成功写一次盘（轨迹逐条追加，此处为 checkpoint 写入频率）

# 处理配置
processing:
  max_workers: 4             # 并行工作线程数
  request_timeout: 300      # 单个请求超时时间（秒）