# GEM 数据合成工作流配置

# LLM 客户端配置
llm:
  base_url: "http://localhost:8000/v1"
  model_name: "Qwen3-8B"
  api_key: "dummy_key"
  temperature: 0.7
  max_tokens: 40960
  top_p: 0.95

# 步骤配置
steps:
  tag_annotation:
    enabled: true
    prompt_path: "src/gem/prompts/tag_annotation.md"
  
  workflow_discovery:
    enabled: true
    prompt_path: "src/gem/prompts/workflow_and_tool_discovery.md"
  
  trajectory_generation:
    enabled: true
    prompt_path: "src/gem/prompts/trajectory_generation.md"
  
  trajectory_refinement:
    enabled: true
    prompt_path: "src/gem/prompts/trajectory_refinement.md"
  
  hallucination_detection:
    enabled: true
    prompt_path: "src/gem/prompts/hallucination_detection.md"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"